# Config file for GitLab CI pipeline

image: python:3.12

# Change pip's cache directory to be inside the project directory since we can
# only cache local items.
variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

stages:
  - build
  - test
  - build_and_publish_docs
  - publish_zenodo

# Configuration --------------------------------------------------------------------

# Pip's cache doesn't store the python packages
# https://pip.pypa.io/en/stable/reference/pip_install/#caching
#
# If you want to also cache the installed packages, you have to install
# them in a virtualenv and cache it as well.
cache:
  paths:
    - .cache/pip
    # - venv/

before_script:
  - python -V # Print out python version for debugging
  - pip install virtualenv setuptools wheel
  - virtualenv venv${python_version}
  - source venv${python_version}/bin/activate

.parallel_python_jobs:
  parallel:
    matrix:
      - python_version: ["3.12", "3.13"]

.run_on_all_branches:
  only:
    refs:
      - develop
      - merge_requests
      - triggers
      - master
      - main
      - tags
      - /^v[0-9]+.[0-9]+.*/

# Jobs: Build -----------------------------------------------------------------

build-package:
  stage: build
  script:
    - pip install build twine
    - python -m build
    - TWINE_PASSWORD=${CI_JOB_TOKEN} TWINE_USERNAME=gitlab-ci-token python -m twine upload --repository-url ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi dist/*
  only:
    - tags

# Jobs: Test ------------------------------------------------------------------

test:
  image: "python:${python_version}"
  script:
    - pip install -e ".[dev]"
    # platform_status_db is not on PyPI; config.py queries it on import, so its tables must exist
    - pip install "git+https://gitlab.com/OpenLabAutomation/lab-automation-packages/platform_status_db.git"
    - django-admin migrate --settings=platform_status_db.larastatus.settings
    - python -m pytest tests/
  extends:
    - .run_on_all_branches
    - .parallel_python_jobs

# Jobs: Docs -----------------------------------------------------------------------

pages:
  stage: build_and_publish_docs
  pages: true
  script:
    - pip install -e ".[docs]"
    - make publish-gitlab
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# Jobs: Publish ---------------------------------------------------------------

release_zenodo:
  stage: publish_zenodo
  script:
    - pip install requests pyyaml
    - python scripts/publish_zenodo.py
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v?[0-9]+\.[0-9]+.*/'
      when: on_success
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"'
      when: manual
      allow_failure: true

linting_formatting:
  script:
    - |
      ruff_version=$(grep -oP '(?<=ruff)[^"]+' pyproject.toml)
      pip install ruff$ruff_version
      echo "Running ruff version $(ruff -V)"
      echo "Check linting"
      ruff check
      echo "Check formatting"
      ruff format --check -s
  extends:
    - .run_on_all_branches
