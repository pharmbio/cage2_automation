# Jobs: Test ------------------------------------------------------------------

# ============================= TEST ========================
test:
  image: "python:${python_version}"
  script:
    #- pip install tox flake8
    #- tox -e py39,flake8
    - pip install pytest
    #- python -m pytest
  extends:
    - .run_on_all_branches
    - .parallel_python_jobs

# Jobs: Docs -----------------------------------------------------------------------

pages:
  stage: build_and_publish_docs
  pages: true
  script:
    - pip install -e ".[docs]"
    - pip install uupythonlab
    - pip install jinja2
    - make publish-gitlab
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# Jobs: Publish ---------------------------------------------------------------

release_pypi:
  variables:
    python_version: "3.9"
  stage: publish_pypi
  script:
    - |
      poetry run invoke release-twine \
        --tag_name="${tag_name}" \
        --pypi_user="${pypi_user}" \
        --pypi_pass="${pypi_pass}" \
        --pypi_publish_repository="${pypi_publish_repository}" \
        --pip_repository_index="${pip_repository_index}"
  extends:
    #- .run_on_release_tag
    - .run_on_manual
    #- .use_generated_docker_image

release_zenodo:
  stage: publish_zenodo
  script:
    - pip install requests pyyaml
    - python scripts/publish_zenodo.py
    # publish_zenodo.py writes the new deposition id into .zenodo_id (first
    # publish only) and CITATION.cff's version/date get bumped separately by
    # bump-my-version before this job runs. Both need to land back in the
    # repo so the *next* release knows to call Zenodo's "new version" API
    # instead of creating a duplicate deposition. Tag/manual pipelines run on
    # a detached ref (a tag, or a manually-triggered run on a branch pipeline
    # that still isn't guaranteed to be the branch tip), so we can't just
    # `git push` the current ref — we push straight to CI_DEFAULT_BRANCH.
    # Guarded with git status so re-running with no metadata change (e.g. a
    # manual re-run) doesn't create an empty commit.
    - |
      if [ -n "$(git status --porcelain .zenodo_id CITATION.cff)" ]; then
        git config user.email "ci@gitlab.com"
        git config user.name "GitLab CI"
        git remote set-url origin "https://gitlab-ci-token:${GITLAB_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
        git add .zenodo_id CITATION.cff
        git commit -m "chore: update Zenodo record id / citation metadata [skip ci]"
        git push origin HEAD:${CI_DEFAULT_BRANCH}
      fi
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v?[0-9]+\.[0-9]+.*/'
      when: on_success
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"'
      when: manual
      allow_failure: true

linting_formatting:
  variables:
    python_version: "3.11"
  script:
    - |
      ruff_version=$(grep -oP '(?<=ruff)[^"]+' pyproject.toml)
      pip install ruff$ruff_version
      echo "Running ruff version $(ruff -V)"
      echo "Check linting"
      ruff check
      echo "Check formatting"
      ruff format --check -s
  extends:
    - .run_on_all_branches
