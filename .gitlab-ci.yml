# Config file for GitLab CI pipeline

image: python:3.12

# Change pip's cache directory to be inside the project directory since we can
# only cache local items.
variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  SOURCE_DIR: "$CI_PROJECT_DIR/lab_adaption"
  DOCS_DIR: "docs"
  DOCS_SOURCE_DIR: "docs/source"
  DOCS_BUILD_DIR: "docs/_build"

stages:
  - build
  - compliance
  - test
  - build_and_publish_docs
  - publish_pypi
  - publish_zenodo

# Configuration --------------------------------------------------------------------

# Pip's cache doesn't store the python packages
# https://pip.pypa.io/en/stable/reference/pip_install/#caching
#
# If you want to also cache the installed packages, you have to install
# them in a virtualenv and cache it as well.
cache:
  paths:
    - .cache/pip
    # - venv/

before_script:
  - python -V # Print out python version for debugging
  - pip install virtualenv setuptools wheel
  - virtualenv venv${python_version}
  - source venv${python_version}/bin/activate

.parallel_python_jobs:
  parallel:
    matrix:
      - python_version: ["3.10", "3.11", "3.12"] # "3.9" is currently not supported

.run_on_all_branches:
  only:
    refs:
      - develop
      - merge_requests
      - triggers
      - master
      - main
      - tags
      - /^v[0-9]+.[0-9]+.*/

.run_on_master:
  only:
    refs:
      - triggers
      - master
      - main

.run_on_release_tag:
  only:
    refs:
      - tags
      - /^v[0-9]+.[0-9]+.*/

.run_on_manual:
  only:
    refs:
      - manual

# Jobs: Build -----------------------------------------------------------------

build-package:
  stage: build
  script:
    - pip install build twine
    - python -m build
    - TWINE_PASSWORD=${CI_JOB_TOKEN} TWINE_USERNAME=gitlab-ci-token python -m twine upload --repository-url ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi dist/*
  only:
    - tags

